name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &code
      - '**.go'
      - go.mod
      - go.sum
      - .github/workflows/build.yml
  pull_request:
    paths: *code

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o "better-git-$GOOS-$GOARCH" .

      - uses: actions/upload-artifact@v6
        with:
          # Asset names must match what install.sh downloads: better-git-<os>-<arch>
          name: better-git-${{ matrix.goos }}-${{ matrix.goarch }}
          path: better-git-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
